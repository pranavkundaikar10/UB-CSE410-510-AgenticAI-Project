[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triage"
version = "0.1.0"
description = "Incident Triage Agent: bounded LangGraph investigations that draft cited reports for human review."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.20",
    "pydantic>=2.14.3",
    "openai>=3.48.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0"]

[project.scripts]
triage = "triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning"]
